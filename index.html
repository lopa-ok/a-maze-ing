<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay"></div>
    <div class="game-container">
        <canvas id="mazeCanvas"></canvas>
        <div class="game-controls game-controls-bottom">
            <div id="timer" class="timer">Time: 0</div>
            <button id="giveUpButton" class="give-up-button">Give Up</button>
        </div>
    </div>
    <div id="menuOverlay" class="overlay">
        <div class="menu">
            <h2 id="menuTitle">Congratulations!</h2>
            <p id="menuMessage">You reached the end of the maze.</p>
            <p id="finalTime"></p>
            <button onclick="restartGame()">Main menu</button>
        </div>
    </div>
    <div id="mainMenu" class="overlay">
        <div class="maze-bg">
            <svg class="maze-svg maze-svg-1" viewBox="0 0 120 120" fill="none">
                <rect x="10" y="10" width="100" height="100" stroke="#ffcc33" stroke-width="4"/>
                <path d="M30 30 H90 V90 H30 V30 Z" stroke="#ffb347" stroke-width="3" fill="none"/>
                <path d="M50 50 H70 V70 H50 V50 Z" stroke="#ffcc33" stroke-width="2" fill="none"/>
            </svg>
            <svg class="maze-svg maze-svg-2" viewBox="0 0 120 120" fill="none">
                <rect x="20" y="20" width="80" height="80" stroke="#ffb347" stroke-width="4"/>
                <path d="M40 40 H80 V80 H40 V40 Z" stroke="#ffcc33" stroke-width="3" fill="none"/>
                <path d="M60 60 H70 V70 H60 V60 Z" stroke="#ffb347" stroke-width="2" fill="none"/>
            </svg>
            <svg class="maze-svg maze-svg-3" viewBox="0 0 160 160" fill="none">
                <rect x="30" y="30" width="100" height="100" stroke="#ffcc33" stroke-width="3"/>
                <path d="M50 50 H130 V130 H50 V50 Z" stroke="#ffb347" stroke-width="2" fill="none"/>
                <path d="M80 80 H100 V100 H80 V80 Z" stroke="#ffcc33" stroke-width="1.5" fill="none"/>
            </svg>
            <svg class="maze-svg maze-svg-4" viewBox="0 0 100 100" fill="none">
                <rect x="10" y="10" width="80" height="80" stroke="#ffb347" stroke-width="2"/>
                <path d="M20 20 H80 V80 H20 V20 Z" stroke="#ffcc33" stroke-width="2" fill="none"/>
                <path d="M35 35 H65 V65 H35 V35 Z" stroke="#ffb347" stroke-width="1" fill="none"/>
            </svg>
            <svg class="maze-svg maze-svg-anim" viewBox="0 0 120 120" fill="none">
                <rect x="15" y="15" width="90" height="90" stroke="#ffcc33" stroke-width="2"/>
                <path d="M30 60 H90" stroke="#ffb347" stroke-width="2" fill="none"/>
                <path d="M60 30 V90" stroke="#ffb347" stroke-width="2" fill="none"/>
            </svg>
        </div>
        <div class="menu">
            <h2>Maze Game</h2>
            <p>Select Difficulty</p>
            <button onclick="startGame('easy')">Easy</button>
            <button onclick="startGame('medium')">Medium</button>
            <button onclick="startGame('hard')">Hard</button>
        </div>
    </div>
    <script src="script.js"></script>
    <a
      href="https://github.com/lopa-ok/a-maze-ing"
      target="_blank"
      rel="noopener"
      class="custom-github-btn"
      aria-label="Star on GitHub"
    >
      <span class="absolute right-0 -mt-12 h-32 w-8 translate-x-12 rotate-12 bg-white opacity-10 transition-all duration-1000 ease-out group-hover:-translate-x-40"></span>
      <div class="flex items-center">
        <svg class="w-4 h-4" viewBox="0 0 438.549 438.549" fill="#fff">

        <span class="ml-1 text-white">GitHub</span>
        <svg class="w-4 h-4 text-gray-500 star-icon transition-all duration-300 ml-2" fill="currentColor" viewBox="0 0 24 24">
          <path clip-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" fill-rule="evenodd"></path>
        </svg>
      </div>
    </a>

      href="https://instagram.com/YOUR_INSTAGRAM_USERNAME"
      target="_blank"
      rel="noopener"
      class="custom-instagram-btn"
      aria-label="Follow on Instagram"
    >
      <span class="absolute right-0 -mt-12 h-32 w-8 translate-x-12 rotate-12 bg-white opacity-10 transition-all duration-1000 ease-out group-hover:-translate-x-40"></span>
      <div class="flex items-center">
        <svg viewBox="0 0 16 16" class="bi bi-instagram w-4 h-4 ml-0" fill="currentColor" height="24" width="24">

        </svg>
        <span class="ml-1 text-white">Instagram </span>
      </div>
    </a>
</body>
</html>
